# https://sw.kovidgoyal.net/kitty/kittens/quick-access-terminal/#configuration

edge center
# lines is ignored when edge=center (panel anchors to all sides)
# lines 30
# hide_on_focus_loss yes
background_opacity .65

kitty_override font_size=16.0
kitty_override background_image=none

# Keep below level 20 so the macOS IME candidate window (level 20) stays visible.
# kCGUtilityWindowLevel == 19. See kovidgoyal/kitty#10172.
kitty_override macos_ns_window_layer=kCGUtilityWindowLevel

# No background image here, so the default pure black shows through.
# Darker than tab_bar_background in custom.conf. Blur needs opacity < 1 to show.
kitty_override background=#151622
kitty_override background_blur=8
